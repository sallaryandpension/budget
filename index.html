<!DOCTYPE html>

<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>התקציב שלי</title>
<link rel="manifest" href="manifest.webmanifest">

<body>

  </div>
  <nav id="tabs" class="tabs" aria-label="דוחות">
    <a href="#home" data-tab="home">🏠 ראשי</a>
    <a href="#expenses" data-tab="expenses">🧾 הוצאות</a>
    <a href="#income" data-tab="income">💼 הכנסות</a>

    <a href="#settings" data-tab="settings">⚙️ הגדרות</a>
  </nav>
</header>

<main>
  <section id="view-home" class="view"></section>
  <section id="view-expenses" class="view hidden"></section>
  <section id="view-income" class="view hidden"></section>
  <section id="view-invest" class="view hidden"></section>
  <section id="view-settings" class="view hidden"></section>
</main>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="dlg" class="modal dlg hidden"><div class="dlg-box" id="dlgBox" role="alertdialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/core.js?v=3"></script>
<script src="js/sync.js?v=3"></script>
